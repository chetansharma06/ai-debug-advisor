[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debug-advisor"
version = "0.1.0"
description = "AI-powered code debugging advisor with graded hints"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "ruff>=0.4",
    "radon>=6",
    "pyflakes>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]